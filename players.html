    <link rel="stylesheet" href="assets/css/responsive.css">

</head>

       <div class="dropdown-content">

</nav>

<main>

<section class="page-section">

<div class="container">

<div class="page-header">

    <div>

        <h1>プレイヤー一覧</h1>

        <p>
            国内外で活躍するストリートファイター6のプレイヤーを紹介します
        </p>

    </div>

</div>

<section class="search-section">

    <div class="stack search-toolbar">

        <input
            id="playerSearch"
            class="input"
            type="text"
            placeholder="プレイヤー名で検索"
        >

        <input
            id="characterSearch"
            class="input"
            type="text"
            placeholder="使用キャラクター名で検索（例：JP、ケン、豪鬼）"
        >

    </div>

</section>

<section class="filter-section">

    <h3 class="filter-title">カテゴリ</h3>

    <div class="stack filter-area">

        <button class="filter-button active" data-filter="all">全て</button>
        <button class="filter-button" data-filter="pro">プロ</button>
        <button class="filter-button" data-filter="vtuber">VTuber</button>
        <button class="filter-button" data-filter="streamer">ストリーマー</button>
        <button class="filter-button" data-filter="youtuber">YouTuber</button>

    </div>

</section>

<section class="filter-section">

    <h3 class="filter-title">地域</h3>

    <div class="stack filter-area">

        <button class="filter-button country-button active" data-country="all">全て</button>
        <button class="filter-button country-button" data-country="japan">日本勢</button>
        <button class="filter-button country-button" data-country="overseas">海外勢</button>

    </div>

</section>

<section class="character-section">

    <p id="playerResultCount" class="result-count"></p>

    <div
        id="playerArea"
        class="grid grid-3"
    ></div>

</section>

</div>

</section>

</main>

<script src="assets/js/character-data.js"></script>
<script src="assets/js/pro.js"></script>
<script src="assets/js/streamer.js"></script>
<script src="assets/js/vtuber.js"></script>
<script src="assets/js/youtuber.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/players-list.js"></script>
</body>

</html>
