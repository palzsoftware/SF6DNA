<main class="container">

    <div class="page-header">

        <p class="section-label">RANK</p>
        <h1>ランク管理</h1>

        <p>
            自分のMR（マスターレート）の推移を記録できます。公式サイトで確認したMRを手動で入力してください。
        </p>

    </div>

    <section class="rank-input-section">

        <h2>今日の記録を追加</h2>

        <form id="rankForm" class="rank-form">

            <label>
                日付
                <input type="date" name="date" id="rankDate" required>
            </label>

            <label>
                MR（マスターレート）
                <input type="number" name="mr" placeholder="例：1650" min="0" required>
            </label>

            <label>
                LP（リーグポイント・任意）
                <input type="number" name="lp" placeholder="例：45000" min="0">
            </label>

            <label>
                使用キャラ（任意）
                <select name="character" id="rankCharacterSelect">
                    <option value="">選択しない</option>
                </select>
            </label>

            <label class="rank-form-note-field">
                メモ（任意）
                <input type="text" name="note" placeholder="例：連勝中、調子が良い">
            </label>

            <button type="submit" class="btn btn-primary">
                記録を追加
            </button>

        </form>

    </section>

    <section class="rank-chart-section">

        <h2>MR推移グラフ</h2>

        <div id="rankChartArea" class="rank-chart-area">
            <p class="rank-empty">まだ記録がありません。上のフォームから記録を追加してください。</p>
        </div>

    </section>

    <section class="rank-history-section">

        <div class="history-header">

            <h2>記録一覧</h2>

            <button id="clearRankButton" class="btn btn-secondary btn-small">
                全て削除
            </button>

        </div>

        <div id="rankHistoryArea" class="rank-history-area"></div>

    </section>
