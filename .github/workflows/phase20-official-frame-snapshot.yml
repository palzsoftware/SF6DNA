name: Phase20 Official Frame Snapshot

on:
  workflow_dispatch:
  push:
    branches: [sf6dna-v2]
    paths:
      - "scripts/phase20-fetch-official-frame-snapshots.mjs"
      - ".github/workflows/phase20-official-frame-snapshot.yml"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current CAPCOM frame snapshots through read-only mirror
        run: node scripts/phase20-fetch-official-frame-snapshots.mjs
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: phase20-official-frame-snapshots
          path: artifacts/phase20-official-frame-snapshots
          retention-days: 7
