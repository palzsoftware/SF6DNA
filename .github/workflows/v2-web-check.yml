name: SF6DNA v2 Web Check

on:
  push:
    branches: [sf6dna-v2]
    paths:
      - "v2-web/**"
      - "supabase/migrations/**"
      - ".github/workflows/v2-web-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Release gate tests
        run: npm run test:release-gates

      - name: Build
        run: npm run build
