name: Phase20 Frame Crosscheck

on:
  push:
    branches: [sf6dna-v2]
    paths:
      - ".github/workflows/phase20-frame-crosscheck.yml"
      - "scripts/phase20-crosscheck-official-frames.py"
      - "scripts/phase20-crosscheck-official-frames-v2.py"
      - "scripts/phase20-match-same-name-groups.py"
      - "scripts/phase20-match-field-only.py"
      - "scripts/phase20-match-bilingual-names.py"
      - "scripts/phase20-fetch-official-frame-snapshots.mjs"
  workflow_dispatch:

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      SUPABASE_URL: https://wnuxaxbrpudyypzdbdho.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_TCdyNFnbYzAGAN6Zlic0yA_YYPZfnTq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse Phase20 official snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts /tmp/phase20-reuse
          gh run download 33156234153 -n phase20-frame-crosscheck-v2 -D /tmp/phase20-reuse || true
          for d in phase20-official-frame-snapshots-ja-jp phase20-official-frame-snapshots-en-uk; do
            if [ -d "/tmp/phase20-reuse/$d" ]; then cp -R "/tmp/phase20-reuse/$d" "artifacts/$d"; fi
          done
      - name: Fetch CAPCOM Japanese frame snapshots if needed
        env:
          FRAME_LOCALE: ja-jp
        run: |
          if [ ! -f artifacts/phase20-official-frame-snapshots-ja-jp/manifest.json ]; then
            node scripts/phase20-fetch-official-frame-snapshots.mjs
          fi
      - name: Fetch CAPCOM English frame snapshots if needed
        env:
          FRAME_LOCALE: en-uk
        run: |
          if [ ! -f artifacts/phase20-official-frame-snapshots-en-uk/manifest.json ]; then
            node scripts/phase20-fetch-official-frame-snapshots.mjs
          fi
      - name: Crosscheck DB fingerprints against CAPCOM current data
        run: python scripts/phase20-crosscheck-official-frames-v2.py
      - name: Match same-name strength and OD groups
        run: python scripts/phase20-match-same-name-groups.py
      - name: Match unique frame signatures without relying on move names
        run: python scripts/phase20-match-field-only.py
      - name: Match bilingual official move names
        run: python scripts/phase20-match-bilingual-names.py
      - name: Upload crosscheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase20-frame-crosscheck-v2
          path: |
            artifacts/phase20-frame-crosscheck-v2
            artifacts/phase20-same-name-groups
            artifacts/phase20-field-only
            artifacts/phase20-bilingual-names
            artifacts/phase20-official-frame-snapshots-ja-jp
            artifacts/phase20-official-frame-snapshots-en-uk
          retention-days: 7
