name: Phase20 Frame Crosscheck

on:
  push:
    branches: [sf6dna-v2]
    paths:
      - ".github/workflows/phase20-frame-crosscheck.yml"
      - "scripts/phase20-crosscheck-official-frames.py"
      - "scripts/phase20-fetch-official-frame-snapshots.mjs"
  workflow_dispatch:

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://wnuxaxbrpudyypzdbdho.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_TCdyNFnbYzAGAN6Zlic0yA_YYPZfnTq
      FRAME_LOCALE: ja-jp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch CAPCOM Japanese frame snapshots
        run: node scripts/phase20-fetch-official-frame-snapshots.mjs
      - name: Crosscheck DB fingerprints against CAPCOM current data
        run: python scripts/phase20-crosscheck-official-frames.py
      - name: Upload crosscheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase20-frame-crosscheck
          path: artifacts/phase20-frame-crosscheck
          retention-days: 7
