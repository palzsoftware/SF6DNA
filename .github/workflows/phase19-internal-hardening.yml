name: Phase19 Internal Hardening

on:
  push:
    branches: [sf6dna-v2]
    paths:
      - "v2-web/**"
      - "supabase/migrations/**"
      - ".github/workflows/phase19-internal-hardening.yml"
  workflow_dispatch:

jobs:
  internal-hardening:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Policy tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Phase19 release-critical static invariants
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const read = (path) => fs.readFileSync(path, 'utf8');
          const compactSql = (value) => value.replace(/\s+/g, ' ');
          const moveGate = read('src/lib/public-move-gate.ts');
          const strategyActions = read('src/app/admin/content/[kind]/actions.ts');
          const diagnosisActions = read('src/app/admin/diagnoses/actions.ts');
          const traitActions = read('src/app/admin/character-traits/actions.ts');
          const sourceActions = read('src/app/admin/sources/actions.ts');
          const search = read('src/lib/search.ts');
          const knowledge = read('src/lib/knowledge.ts');
          const characters = read('src/lib/characters.ts');
          const recommendations = read('src/lib/character-recommendations.ts');
          const coach = read('src/app/api/coach/retrieve/route.ts');
          const auth = read('src/app/auth/page.tsx');
          const robots = read('src/app/robots.ts');
          const moveRlsPolicy = compactSql(read('../supabase/migrations/20260828_phase19_strict_public_move_rls.sql'));
          const moveRlsEvidence = compactSql(read('../supabase/migrations/20260828_phase19_require_official_move_and_frame_sources.sql'));
          const strategyRls = compactSql(read('../supabase/migrations/20260828_phase18_strategy_source_public_gate.sql'));
          const sourceNormalization = compactSql(read('../supabase/migrations/20260828_phase19_normalize_guide_section_source_type.sql'));
          const phase23PublicationGates = compactSql(read('../supabase/migrations/20260829_phase23_publication_gate_hardening.sql'));
          const atomicPatchSwitch = compactSql(read('../supabase/migrations/20260829_phase23_atomic_current_patch_switch.sql'));

          for (const required of [
            '.eq("status", "published")',
            '.eq("control_scheme", "classic")',
            '.eq("is_current", true)',
            '.eq("verification_status", "verified")',
            'entity_sources',
            '["move_command"]',
            '["frame", "move_frame_data"]',
            '.eq("reliability_level", "official")',
          ]) assert.ok(moveGate.includes(required), `move gate missing ${required}`);
          assert.ok(!moveGate.includes('entity_sources!inner'), 'polymorphic evidence must not use inferred PostgREST joins');

          assert.ok(search.includes('isMovePublicReady'), 'search must post-filter move readiness');
          assert.ok(moveRlsPolicy.includes('private.is_move_public_ready'), 'Move RLS helper missing');
          assert.ok(moveRlsPolicy.includes('public read release-ready moves'), 'strict Move SELECT policy missing');
          assert.ok(moveRlsEvidence.includes("mc.control_scheme = 'classic'"), 'Classic command gate missing');
          assert.ok(moveRlsEvidence.includes("p.is_current = true"), 'Move RLS must require current patch');
          assert.ok(moveRlsEvidence.includes("f.verification_status = 'verified'"), 'Move RLS must require verified frame');
          assert.ok((moveRlsEvidence.match(/reliability_level = 'official'/g) ?? []).length >= 3,
            'Move, Classic Command, and Frame must each require official evidence');

          for (const entity of ['combo', 'setup', 'sequence', 'counter', 'training']) {
            assert.match(strategyRls, new RegExp(`es\\.entity_type\\s*=\\s*'${entity}'`), `${entity} source RLS missing`);
          }

          assert.ok(strategyActions.includes('payload.verification_status !== "verified"'), 'Strategy publish must require verified status');
          assert.ok(strategyActions.includes('hasSourceRelation'), 'Strategy publish must require Source relation');
          assert.ok(strategyActions.includes('requestedStatus === "published"'), 'Strategy publish transition guard missing');
          assert.ok(strategyActions.includes('{ ...payload, status: "draft" }'), 'New published Strategy must be created as draft first');
          assert.ok(strategyActions.includes('update({ status: "published" })'), 'Strategy must promote only after Source relation exists');

          assert.ok(diagnosisActions.includes('ensureDiagnosisPublishable'), 'Diagnosis publish completeness gate missing');
          assert.ok(diagnosisActions.includes('新規診断はdraftで作成し'), 'New Diagnosis must not publish before questions exist');
          assert.ok(diagnosisActions.includes('新規質問はdraftで作成し'), 'New Diagnosis Question must not publish before options exist');
          assert.ok(diagnosisActions.includes('ensureQuestionHasOptions'), 'Published Diagnosis Question must require options');
          assert.ok(diagnosisActions.includes('最後の選択肢は削除できません'), 'Published question must retain at least one option');
          assert.ok(diagnosisActions.includes('diagnosis.status === "published"'), 'Published Diagnosis question_count must follow published questions');

          assert.ok(traitActions.includes('ensureTraitSourceRelation'), 'Character Trait Score must create entity_sources evidence');
          assert.ok(traitActions.includes('entity_type: "character_trait_score"'), 'Character Trait Score entity type mismatch');
          assert.ok(traitActions.includes('requestedStatus === "published" ? "draft"'), 'New published Trait Score must be created as draft first');
          assert.ok(traitActions.includes('verificationStatus !== "verified" || !sourceId'), 'Published Trait Score must require verified status and Source');

          assert.ok(phase23PublicationGates.includes('private.is_diagnosis_public_ready'), 'Diagnosis DB public readiness helper missing');
          assert.ok(phase23PublicationGates.includes('public read release-ready diagnoses'), 'Diagnosis release-ready RLS missing');
          assert.ok(phase23PublicationGates.includes('public read release-ready diagnosis questions'), 'Diagnosis Question parent gate missing');
          assert.ok(phase23PublicationGates.includes('public read release-ready diagnosis options'), 'Diagnosis Option parent gate missing');
          assert.ok(phase23PublicationGates.includes('private.is_character_trait_score_public_ready'), 'Trait Score DB public readiness helper missing');
          assert.ok(phase23PublicationGates.includes("es.entity_type = 'character_trait_score'"), 'Trait Score DB Source relation gate missing');
          assert.ok(phase23PublicationGates.includes("c.status = 'published'"), 'Trait Score parent Character gate missing');
          assert.ok(phase23PublicationGates.includes("t.status = 'published'"), 'Trait Score parent Trait gate missing');

          assert.ok(sourceActions.includes('rpc("set_current_patch"'), 'Admin current patch switch must use atomic RPC');
          assert.ok(sourceActions.includes('is_current: false'), 'New patch must be inserted non-current before atomic switch');
          assert.ok(!sourceActions.includes('update({ is_current: false }).eq("is_current", true)'), 'Admin must not clear current patch outside atomic RPC');
          assert.ok(atomicPatchSwitch.includes('create or replace function public.set_current_patch'), 'Atomic current patch RPC migration missing');
          assert.ok(atomicPatchSwitch.includes('if not private.is_admin()'), 'Atomic current patch RPC must require admin');
          assert.ok(atomicPatchSwitch.includes('grant execute on function public.set_current_patch(uuid) to authenticated'), 'Atomic current patch RPC grant missing');

          assert.match(sourceNormalization, /entity_type\s*=\s*'guide_section'/);
          assert.match(sourceNormalization, /entity_type\s*=\s*'character_guide_section'/);

          assert.ok(characters.includes('.eq("status", "published")'));
          assert.ok(characters.includes('.eq("verification_status", "verified")'));

          for (const table of ['combos', 'setups', 'sequences', 'counters', 'trainings']) {
            const pos = knowledge.indexOf(`.from("${table}")`);
            assert.notEqual(pos, -1, `knowledge missing ${table}`);
            const window = knowledge.slice(pos, pos + 800);
            assert.ok(window.includes('.eq("status", "published")'), `${table} missing published gate`);
            assert.ok(window.includes('.eq("verification_status", "verified")'), `${table} missing verified gate`);
          }

          assert.ok(recommendations.includes('.eq("status", "published")'));
          assert.ok(recommendations.includes('.eq("verification_status", "verified")'));
          assert.ok(recommendations.includes('.eq("entity_type", "character_trait_score")'));

          assert.ok(coach.includes('request.json()'), 'coach invalid JSON boundary missing');
          assert.ok(coach.includes('question.length < 2'), 'coach short input boundary missing');
          assert.ok(coach.includes('question.length > 500'), 'coach long input boundary missing');
          assert.ok(coach.includes('generationEnabled: false'), 'coach generation must remain disabled');
          assert.ok(coach.includes('.filter((item) => item.sources.length > 0)'), 'coach must require sourced evidence');

          assert.ok(auth.includes('candidate?.startsWith("/")'));
          assert.ok(auth.includes('!candidate.startsWith("//")'), 'protocol-relative auth next must be rejected');
          for (const requiredDisallow of ['"/admin"', '"/api/"', '"/auth"']) {
            assert.ok(robots.includes(requiredDisallow), `robots missing ${requiredDisallow}`);
          }

          console.log('Phase19 release-critical static invariants: PASS');
          NODE
