name: Phase16 Release Acceptance

on:
  push:
    branches:
      - sf6dna-v2
    paths:
      - "v2-web/**"
      - ".github/workflows/phase16-release-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://wnuxaxbrpudyypzdbdho.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_TCdyNFnbYzAGAN6Zlic0yA_YYPZfnTq
  NEXT_PUBLIC_SITE_URL: https://preview.invalid

jobs:
  release-acceptance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm start -- -H 127.0.0.1 -p 3000 > /tmp/sf6dna-next.log 2>&1 &
          echo $! > /tmp/sf6dna-next.pid
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sf6dna-next.log
          exit 1

      - name: Metadata and crawl controls
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:3000';
          const routes = ['/', '/search', '/characters', '/characters/aki', '/players', '/players/blaz', '/diagnosis/character-fit-check', '/auth', '/admin'];
          for (const path of routes) {
            const response = await fetch(base + path, { redirect: 'manual' });
            assert.equal(response.status, 200, `${path}: HTTP ${response.status}`);
            const html = await response.text();
            const title = html.match(/<title>(.*?)<\/title>/s)?.[1] ?? '';
            assert.ok(title, `${path}: title missing`);
            assert.ok(!title.includes('| SF6DNA | SF6DNA'), `${path}: duplicated brand in title: ${title}`);
            if (path === '/auth' || path === '/admin') {
              assert.match(html, /<meta[^>]+name="robots"[^>]+content="[^"]*noindex/i, `${path}: noindex missing`);
            }
            console.log(path, title);
          }
          const robots = await (await fetch(base + '/robots.txt')).text();
          for (const path of ['/admin', '/api/', '/auth']) assert.ok(robots.includes(`Disallow: ${path}`), `robots missing ${path}`);
          assert.ok(!robots.includes('/login'), 'stale /login robots rule remains');
          assert.ok(!robots.includes('/signup'), 'stale /signup robots rule remains');
          console.log('metadata/crawl controls: PASS');
          NODE

      - name: Safe empty and invalid route behavior
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:3000';
          for (const path of ['/characters/__phase16_missing__', '/players/__phase16_missing__', '/diagnosis/__phase16_missing__', '/moves/__phase16_missing__']) {
            const response = await fetch(base + path, { redirect: 'manual' });
            assert.equal(response.status, 404, `${path}: expected 404, got ${response.status}`);
          }
          const search = await fetch(base + '/search?q=__phase16_no_result_expected__');
          assert.equal(search.status, 200);
          const searchHtml = await search.text();
          assert.ok(searchHtml.includes('公開済みデータから一致する情報が見つかりませんでした。'), 'safe empty search message missing');

          const shortQuestion = await fetch(base + '/api/coach/retrieve', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question: 'a' }),
          });
          assert.equal(shortQuestion.status, 400, 'short coach question must be rejected');
          const longQuestion = await fetch(base + '/api/coach/retrieve', {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question: 'a'.repeat(501) }),
          });
          assert.equal(longQuestion.status, 400, 'long coach question must be rejected');
          console.log('safe empty/invalid route behavior: PASS');
          NODE

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/sf6dna-next.log || true

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/sf6dna-next.pid ]; then
            kill "$(cat /tmp/sf6dna-next.pid)" || true
          fi
