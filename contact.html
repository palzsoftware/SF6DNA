    <section class="about-contact-section">

        <p class="about-contact-note">
            データ誤りのご指摘・プレイヤー掲載のご希望・ご意見ご要望など、お気軽にお送りください。
        </p>

        <form id="contactForm" class="contact-form">

            <label>
                お名前（任意）
                <input type="text" name="name" placeholder="例：山田太郎">
            </label>

            <label>
                ご用件の種類
                <select name="category">
                    <option>データの誤りを報告する</option>
                    <option>プレイヤー・チームの掲載希望</option>
                    <option>その他のご意見・ご要望</option>
                </select>
            </label>

            <label>
                メールアドレス（返信が必要な場合）
                <input type="email" name="email" placeholder="例：example@mail.com">
            </label>

            <label>
                内容
                <textarea name="message" rows="5" placeholder="内容をご記入ください" required></textarea>
            </label>

            <button type="submit" class="btn btn-primary">
                送信する
            </button>

            <p id="contactStatus" class="contact-status"></p>

        </form>

    </section>
