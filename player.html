<main class="container">

<section class="player-page">

    <!-- =====================
         左サイド
    ====================== -->
    <aside class="player-sidebar">

        <div class="sidebar-section">

            <h3>SNS</h3>

            <a
                id="youtubeLink"
                target="_blank"
                class="player-social youtube"
            >
                ▶ YouTube
            </a>

            <a
                id="twitterLink"
                target="_blank"
                class="player-social twitter"
            >
                ✕ X
            </a>

            <a
                id="twitchLink"
                target="_blank"
                class="player-social twitch"
            >
                🎮 Twitch
            </a>

        </div>

        <div class="sidebar-section">

            <h3>所属チーム</h3>

            <p id="playerTeam"></p>

        </div>

        <div class="sidebar-section">

            <h3>過去所属</h3>

            <ul id="playerPastTeams">

            </ul>

        </div>

        <div class="sidebar-section">

            <h3>チームメンバー</h3>

            <div id="teamMembers">

            </div>

        </div>

    </aside>

    <!-- =====================
         メイン
    ====================== -->

   <section class="player-main">

    <div class="player-card">

        <!-- プロフィール -->
        <div class="player-profile">

            <div class="player-profile-image">

                <img
                    id="playerImage"
                    class="player-image"
                >

            </div>

            <div class="player-profile-info">

    <h1 id="playerName"></h1>

    <p id="playerCountry"></p>

    <p id="playerStyle"></p>

    <div class="player-divider"></div>

    <div class="player-basic-info">

        <div class="info-row">

            <span class="info-label">所属</span>

            <span id="playerTeamInline"></span>

        </div>

        <div class="info-row">

            <span class="info-label">メイン</span>

            <span id="playerMainCharacters"></span>

        </div>

    </div>

</div>

</div>

        <!-- タブ切り替え(公式サイトのOVERVIEW/PLAY風レイアウトを参考) -->

        <div class="player-tabs">

            <button class="player-tab-button active" data-tab="characters">
                使用キャラクター
            </button>

            <button class="player-tab-button" data-tab="achievements">
                大会実績
            </button>

        </div>

        <section class="player-section player-tab-panel active" data-panel="characters">

            <div
                id="playerCharacters"
                class="player-character-grid"
            ></div>

        </section>

        <section class="player-section player-tab-panel" data-panel="achievements">

            <ul id="playerAchievements"></ul>

        </section>

    </div>

</section>   <!-- player-main -->

</section>   <!-- player-page -->

</main>

<script src="assets/js/team-data.js"></script>
<script src="assets/js/player.js"></script>
