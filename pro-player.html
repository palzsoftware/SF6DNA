<p id="playerStyle"></p>

<ul id="playerTips"></ul>

<h3>大会実績</h3>

<script>

const params = new URLSearchParams(location.search);

const id = params.get("id");

const playerName = document.getElementById("playerName");
const playerCharacter = document.getElementById("playerCharacter");
const playerStyle = document.getElementById("playerStyle");
const playerTips = document.getElementById("playerTips");
const playerResults = document.getElementById("playerResults");

const players = {

    kakeru:{

        name:"翔",

        character:"JP",

        style:"待ち・読み合い重視",

        tips:[
            "対空精度",
            "距離管理",
            "ゲージ管理"
        ],

        results:[
            "CAPCOM CUP出場",
            "SFL出場"
        ]

    },

    gachikun:{

        name:"ガチくん",

        character:"ラシード",

        style:"ラッシュ・立ち回り",

        tips:[
            "ラッシュ",
            "画面端継続",
            "読み合い"
        ],

        results:[
            "CAPCOM CUP優勝",
            "EVO上位"
        ]

    },

    higuchi:{

        name:"ひぐち",

        character:"ガイル",

        style:"攻守バランス",

        tips:[
            "守り",
            "飛び道具",
            "対空"
        ],

        results:[
            "SFL優勝",
            "CAPCOM CUP出場"
        ]

    },

    menard:{

    name:"MenaRD",

    character:"ブランカ / ベガ",

    style:"攻守バランス・読み合い",

    tips:[
        "立ち回り",
        "読み合い",
        "状況判断"
    ],

    results:[
        "CAPCOM CUP優勝×2",
        "Red Bull Kumite優勝"
    ]

},
angrybird:{

    name:"AngryBird",

    character:"ケン",

    style:"攻撃型",

    tips:[
        "ラッシュ",
        "火力",
        "起き攻め"
    ],

    results:[
        "CAPCOM CUP優勝",
        "EVO上位"
    ]

},

punk:{

    name:"Punk",

    character:"キャミィ",

    style:"差し返し・精密操作",

    tips:[
        "差し返し",
        "通常技",
        "確認精度"
    ],

    results:[
        "EVO優勝",
        "CAPCOM CUP上位"
    ]

}

};

const player = players[id];

playerName.textContent = player.name;

playerCharacter.textContent =
"使用キャラ：" + player.character;

playerStyle.textContent =
"プレイスタイル：" + player.style;

player.tips.forEach(item=>{

    playerTips.innerHTML += `<li>${item}</li>`;

});

player.results.forEach(item=>{

    playerResults.innerHTML += `<li>${item}</li>`;

});

</script>
